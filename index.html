<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JMC Internal Dashboards Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9; --card: #ffffff; --ink: #0f172a; --muted: #64748b;
      --accent: #3b82f6; --accent-soft: #eff6ff; --accent-hover: #2563eb;
      --border: #e2e8f0; --table-header: #f8fafc;
      --success: #059669; --success-bg: #ecfdf5;
      --warning: #d97706; --warning-bg: #fffbeb;
      --error: #dc2626; --error-bg: #fef2f2;
      --info: #3b82f6; --info-bg: #eff6ff;
      --nav-width: 248px;
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.03);
      --radius: 12px; --radius-sm: 8px; --radius-xs: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; min-height: 100vh; }

    /* ── NAV ── */
    .nav-rail { width: var(--nav-width); background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; flex-shrink: 0; position: fixed; top: 0; left: 0; height: 100vh; display: flex; flex-direction: column; z-index: 100; }
    .nav-header { padding: 18px 16px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 11px; }
    .nav-header .logo-icon { width: 34px; height: 34px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #fff; flex-shrink: 0; box-shadow: 0 2px 8px rgba(59,130,246,0.35); }
    .nav-header .logo-text { font-weight: 700; font-size: 15px; letter-spacing: -0.02em; }
    .nav-header .logo-text small { display: block; font-weight: 400; font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
    .nav-section-label { padding: 18px 16px 5px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.22); font-weight: 600; }
    .nav-links { flex: 1; padding: 4px 6px; overflow-y: auto; scrollbar-width: auto; scrollbar-color: rgba(255,255,255,0.1) transparent; }
    .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 12px; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 12.5px; font-weight: 500; cursor: pointer; border-radius: var(--radius-sm); transition: all 0.15s ease; margin: 1px 0; }
    .nav-link:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); }
    .nav-link.active { background: rgba(59,130,246,0.18); color: #fff; box-shadow: inset 0 0 0 1px rgba(59,130,246,0.2); }
    .nav-link svg { width: 16px; height: 16px; opacity: 0.6; flex-shrink: 0; }
    .nav-link.active svg { opacity: 1; }
    .nav-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 10px; color: rgba(255,255,255,0.2); }

    /* ── MAIN ── */
    .main { flex: 1; margin-left: var(--nav-width); min-height: 100vh; }
    .top-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 28px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow-xs); }
    .top-bar .breadcrumb { font-size: 13px; color: var(--muted); }
    .top-bar .breadcrumb strong { color: var(--ink); font-weight: 600; }
    .content { padding: 24px 28px 48px; }
    .page { display: none; animation: fadeIn 0.2s ease; } .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .page-header { margin-bottom: 22px; }
    .page-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.025em; }
    .page-header p { color: var(--muted); font-size: 13px; }

    /* ── KPI ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow-xs); position: relative; overflow: hidden; transition: transform 0.18s ease, box-shadow 0.18s ease; }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .kpi-card::before { content:''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
    .kpi-card.green::before { background: var(--success); } .kpi-card.yellow::before { background: var(--warning); } .kpi-card.red::before { background: var(--error); }
    .kpi-card .kpi-label { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; font-weight: 500; }
    .kpi-card .kpi-value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }

    /* ── CARD ── */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-xs); margin-bottom: 16px; transition: box-shadow 0.2s ease; }
    .card:hover { box-shadow: var(--shadow-sm); }
    .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.01em; }
    .card .desc { color: var(--muted); font-size: 12px; margin-bottom: 14px; }

    /* ── TABLE ── */
    .table-wrap { overflow: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 10px; background: var(--card); box-shadow: var(--shadow-xs); }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 500px; }
    th, td { border-bottom: 1px solid var(--border); padding: 10px 12px; text-align: left; vertical-align: top; }
    th { background: var(--table-header); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); position: sticky; top: 0; white-space: nowrap; border-bottom: 2px solid var(--border); }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:hover { background: #eef2ff; }
    tbody tr { transition: background 0.1s ease; }
    td[contenteditable] { cursor: text; outline: none; min-width: 60px; }
    td[contenteditable]:focus { background: #fffde7 !important; box-shadow: inset 0 0 0 2px var(--accent); border-radius: 3px; }
    th[contenteditable]:focus { background: #e8ecf0; box-shadow: inset 0 0 0 2px var(--accent); }
    .action-col { width: 36px; text-align: center; padding: 4px; }
    .btn-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 4px 6px; border-radius: var(--radius-xs); transition: all 0.12s; }
    .btn-del:hover { background: var(--error-bg); color: var(--error); }

    /* ── STATUS CELLS ── */
    td.st-needed { background: var(--warning-bg) !important; color: var(--warning); font-weight: 600; }
    td.st-complete { background: var(--success-bg) !important; color: var(--success); font-weight: 600; }
    td.st-na { background: #f1f5f9 !important; color: var(--muted); }
    td.st-pending { background: var(--error-bg) !important; color: var(--error); font-weight: 600; }

    /* ── HEATMAP ── */
    .heatmap { display: grid; gap: 3px; font-size: 10px; }
    .hm-cell { padding: 6px 7px; text-align: center; border-radius: var(--radius-xs); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: transform 0.1s; }
    .hm-cell:not(.hm-hdr):hover { transform: scale(1.03); }
    .hm-hdr { background: var(--table-header); color: var(--muted); font-size: 9px; text-transform: uppercase; }
    .hm-green { background: #d1fae5; color: #065f46; }
    .hm-yellow { background: #fef3c7; color: #92400e; }
    .hm-red { background: #fecaca; color: #991b1b; }
    .hm-gray { background: #f3f4f6; color: #9ca3af; }

    /* ── PROGRESS ── */
    .prog-bar { background: #e5e7eb; border-radius: 99px; height: 7px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
    .prog-fill.green { background: var(--success); } .prog-fill.yellow { background: var(--warning); } .prog-fill.red { background: var(--error); } .prog-fill.blue { background: var(--accent); }

    /* ── BUTTONS ── */
    .btn { padding: 8px 16px; border-radius: var(--radius-sm); font-size: 12px; font-family: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--card); font-weight: 500; transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 5px; }
    .btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 1px 3px rgba(59,130,246,0.25); }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; border-color: var(--accent-hover); box-shadow: 0 4px 12px rgba(59,130,246,0.3); transform: translateY(-1px); }
    .btn-sm { padding: 6px 12px; font-size: 11px; }
    .btn-danger { background: var(--error-bg); color: var(--error); border-color: #fecaca; }
    .btn-danger:hover { background: var(--error); color: #fff; border-color: var(--error); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-xs); }
    .toolbar input[type="search"] { padding: 8px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-family: inherit; min-width: 200px; transition: border-color 0.15s, box-shadow 0.15s; background: var(--bg); }
    .toolbar input[type="search"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); background: #fff; }

    /* ── ALERTS ── */
    .alert-bar { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 12.5px; transition: transform 0.12s; }
    .alert-bar:hover { transform: translateX(2px); }
    .alert-bar.warn { background: var(--warning-bg); border: 1px solid #fde68a; }
    .alert-bar.err { background: var(--error-bg); border: 1px solid #fecaca; }
    .alert-bar.info { background: var(--info-bg); border: 1px solid #bfdbfe; }
    .alert-bar.ok { background: var(--success-bg); border: 1px solid #a7f3d0; }
    .alert-bar a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .alert-bar a:hover { text-decoration: underline; }

    /* ── GRID ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 960px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ── EMPTY STATE ── */
    .empty-state { padding: 48px 24px; text-align: center; color: var(--muted); font-size: 13px; }
    .empty-state p { margin-bottom: 16px; }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: #fff; padding: 12px 24px; border-radius: var(--radius); font-size: 13px; z-index: 300; opacity: 0; transform: translateY(12px); transition: all 0.25s ease; pointer-events: none; box-shadow: var(--shadow-lg); font-weight: 500; }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── MODAL ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; padding: 24px; }
    .modal-overlay.visible { display: flex; }
    .modal { background: var(--card); border-radius: 16px; max-width: 520px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
    .modal-hdr { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-hdr h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .modal-close { background: none; border: none; cursor: pointer; font-size: 22px; color: var(--muted); transition: all 0.12s; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); }
    .modal-close:hover { background: var(--bg); color: var(--ink); }
    .modal-body { padding: 24px; }
    .modal-body label { display: block; font-size: 11.5px; font-weight: 600; margin-bottom: 5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .modal-body input, .modal-body select, .modal-body textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; margin-bottom: 14px; transition: border-color 0.15s, box-shadow 0.15s; }
    .modal-body input:focus, .modal-body select:focus, .modal-body textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .modal-body textarea { min-height: 60px; resize: vertical; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--border); }

    .source-link { font-size: 10px; color: var(--muted); margin-top: 8px; }
    .source-link a { color: var(--accent); text-decoration: none; }
    .source-link a:hover { text-decoration: underline; }
    ::-webkit-scrollbar { width: 12px; height: 12px; } ::-webkit-scrollbar-track { background: var(--bg); border-radius: 6px; } ::-webkit-scrollbar-thumb { background: #b0b7c3; border-radius: 6px; border: 2px solid var(--bg); } ::-webkit-scrollbar-thumb:hover { background: #8f97a5; }
    * { scrollbar-width: auto; scrollbar-color: #b0b7c3 var(--bg); }

    /* ═══════════════════════════════════════════════════════════════════════
       ANNUAL CALENDAR
       ═══════════════════════════════════════════════════════════════════ */
    .cal-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-xs); }
    .cal-view-group { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .cal-view-btn { padding: 7px 16px; font-size: 11px; font-weight: 600; font-family: inherit; border: none; background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 5px; }
    .cal-view-btn:not(:last-child) { border-right: 1px solid var(--border); }
    .cal-view-btn:hover { color: var(--ink); background: #fff; }
    .cal-view-btn.active { background: var(--accent); color: #fff; }
    .cal-view-btn svg { width: 14px; height: 14px; }
    .cal-nav { display: flex; align-items: center; gap: 4px; }
    .cal-nav-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); cursor: pointer; color: var(--muted); transition: all 0.12s; }
    .cal-nav-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .cal-nav-btn svg { width: 14px; height: 14px; }
    .cal-month-label { font-weight: 700; font-size: 14px; min-width: 140px; text-align: center; }
    .cal-today-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); font-size: 11px; font-weight: 600; font-family: inherit; cursor: pointer; color: var(--accent); transition: all 0.12s; }
    .cal-today-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
    .cal-filter-wrap { position: relative; }
    .cal-filter-btn { padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); font-size: 11px; font-weight: 500; font-family: inherit; cursor: pointer; color: var(--muted); display: flex; align-items: center; gap: 5px; transition: all 0.12s; }
    .cal-filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cal-filter-dd { display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; z-index: 20; min-width: 200px; box-shadow: var(--shadow-lg); }
    .cal-filter-dd.open { display: block; }
    .cal-filter-dd label { display: flex; align-items: center; gap: 7px; font-size: 11.5px; padding: 5px 7px; cursor: pointer; border-radius: var(--radius-xs); margin-bottom: 2px; transition: background 0.1s; }
    .cal-filter-dd label:hover { background: var(--bg); }
    .cal-filter-dd input[type="checkbox"] { accent-color: var(--accent); }
    .cal-filter-dd .cal-filter-pill { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

    /* ── LEGEND ── */
    .cal-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); cursor: pointer; padding: 4px 10px; border-radius: 99px; transition: all 0.12s; background: var(--card); border: 1px solid var(--border); font-weight: 500; }
    .cal-legend-item:hover { border-color: var(--accent); color: var(--accent); }
    .cal-legend-item.dimmed { opacity: 0.3; }
    .cal-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── GANTT (TIMELINE) VIEW ── */
    .gantt-wrap { overflow: auto; max-height: 620px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow-sm); }
    .gantt-inner { position: relative; }
    .gantt-header { display: flex; position: sticky; top: 0; z-index: 4; background: var(--table-header); border-bottom: 2px solid var(--border); }
    .gantt-label-hdr { display: flex; align-items: center; padding: 0 14px; font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; border-right: 1px solid var(--border); position: sticky; left: 0; z-index: 5; background: var(--table-header); }
    .gantt-month-col { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--muted); border-right: 1px solid #edf0f4; white-space: nowrap; }
    .gantt-row { display: flex; align-items: center; border-bottom: 1px solid #f0f2f5; transition: background 0.1s; }
    .gantt-row:hover { background: #f8faff !important; }
    .gantt-label { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-right: 1px solid var(--border); overflow: hidden; position: sticky; left: 0; z-index: 2; }
    .gantt-label .prog-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 9px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    .gantt-label .evt-name { font-size: 11.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
    .gantt-bar { position: absolute; border-radius: var(--radius-xs); display: flex; align-items: center; padding: 0 8px; font-size: 10px; font-weight: 600; cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; box-shadow: var(--shadow-xs); }
    .gantt-bar:hover { transform: scaleY(1.15) scaleX(1.01); box-shadow: var(--shadow-md); z-index: 6 !important; }
    .gantt-today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--error); z-index: 3; pointer-events: none; }
    .gantt-today-label { position: sticky; top: 0; font-size: 8px; font-weight: 700; color: var(--error); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; background: var(--error-bg); padding: 1px 5px; border-radius: 3px; display: inline-block; transform: translateX(-50%); }
    .gantt-grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); opacity: 0.4; pointer-events: none; z-index: 1; }

    /* ── LIST VIEW ── */
    .cal-list { display: flex; flex-direction: column; gap: 12px; }
    .cal-list-month { margin-bottom: 4px; }
    .cal-list-month-header { font-size: 17px; font-weight: 700; padding: 10px 0; border-bottom: 2px solid var(--border); margin-bottom: 12px; color: var(--ink); display: flex; align-items: center; gap: 10px; letter-spacing: -0.01em; }
    .cal-list-month-header .month-count { font-size: 11px; font-weight: 500; color: var(--muted); background: var(--bg); padding: 3px 10px; border-radius: 99px; }
    .cal-list-events { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
    .cal-evt-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; transition: all 0.15s ease; cursor: pointer; position: relative; overflow: hidden; box-shadow: var(--shadow-xs); }
    .cal-evt-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .cal-evt-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
    .cal-evt-card .evt-color-bar { width: 4px; flex-shrink: 0; border-radius: 2px; align-self: stretch; min-height: 36px; }
    .cal-evt-card .evt-body { flex: 1; min-width: 0; }
    .cal-evt-card .evt-title { font-weight: 600; font-size: 13.5px; margin-bottom: 2px; }

function getModule(id) { return MODULES.find(m => m.id === id); }

// ═══════════════════════════════════════════════════════════════════════════
// DATA LAYER (localStorage)
// ═══════════════════════════════════════════════════════════════════════════
const STORE_KEY = 'jmc_platform_v2';

function getStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; }
}
function setStore(data) { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
function getData(moduleId) { return getStore()[moduleId] || null; }
function setData(moduleId, data) { const s = getStore(); s[moduleId] = data; s._lastModified = new Date().toISOString(); setStore(s); }
function clearData(moduleId) { const s = getStore(); delete s[moduleId]; setStore(s); }
function isInitialized() { return !!getStore()._initialized; }
function markInitialized() { const s = getStore(); s._initialized = true; setStore(s); }

// ═══════════════════════════════════════════════════════════════════════════
// HTML PARSING (import from source files)
// ═══════════════════════════════════════════════════════════════════════════
function cleanText(t) { return (t || '').replace(/\s+/g, ' ').trim(); }

async function parseSourceFile(file) {
  try {
    const res = await fetch(file);
    if (!res.ok) return null;
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const table = doc.querySelector('table.waffle');
    if (!table) return null;
    const rows = Array.from(table.querySelectorAll('tbody tr'));
    if (!rows.length) return null;
    const headers = Array.from(rows[0].querySelectorAll('td, th')).map(c => cleanText(c.textContent));
    const body = rows.slice(1).map(r => Array.from(r.querySelectorAll('td')).map(c => cleanText(c.textContent)));
    return { headers, rows: body.filter(r => r.some(c => c)) };
  } catch { return null; }
}

async function importModule(moduleId) {
  const mod = getModule(moduleId);
  if (!mod || !mod.source) return null;
  const files = Array.isArray(mod.source) ? mod.source : [mod.source];
  const tables = [];
  for (const f of files) {
    const t = await parseSourceFile(f);
    if (t && t.rows.length) tables.push(t);
  }
  if (!tables.length) return null;
  const merged = tables.length === 1 ? tables[0] : {
    headers: tables[0].headers,
    rows: tables.flatMap(t => t.rows)
  };
  setData(moduleId, merged);
  return merged;
}

async function autoImportAll() {
  const sourceMods = MODULES.filter(m => m.source);
  let imported = 0;
  for (const mod of sourceMods) {
    if (!getData(mod.id)) {
      const result = await importModule(mod.id);
      if (result) imported++;
    }
  }
  return imported;
}

// ═══════════════════════════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function statusClass(val) {
  const v = (val || '').toLowerCase();
  if (v.includes('needed') || v.includes('expir')) return 'st-needed';
  if (v.includes('complete') || v.includes('confirm') || v.includes('verified') || v.includes('done') || v.includes('pass') || v.includes('signed') || v.includes('approved')) return 'st-complete';
  if (v.includes('n/a') || v === 'na' || v === '—' || v === '-') return 'st-na';
  if (v.includes('pending') || v.includes('overdue') || v.includes('missing') || v.includes('rejected')) return 'st-pending';
  return '';
}

function openModal(title, bodyHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalOverlay').classList.add('visible');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('visible'); }

// ═══════════════════════════════════════════════════════════════════════════
// EDITABLE TABLE
// ═══════════════════════════════════════════════════════════════════════════
function renderEditableTable(containerId, moduleId, searchQuery) {
  const container = document.getElementById(containerId);
  const mod = getModule(moduleId);
  let data = getData(moduleId);

  if (!data || !data.headers || !data.headers.length) {
    let html = '<div class="empty-state"><p>No data loaded for this module.</p>';
    if (mod && mod.source) {
      html += `<button class="btn btn-primary" onclick="doImport('${moduleId}')">Import from Source File</button> `;
    }
    if (mod && mod.defaultHeaders) {
      html += `<button class="btn" onclick="initEmpty('${moduleId}')">Create Empty Table</button>`;
    } else if (!mod.source) {
      html += `<button class="btn" onclick="promptHeaders('${moduleId}')">Create Table with Custom Columns</button>`;
    }
    html += '</div>';
    container.innerHTML = html;
    return;
  }

  let rows = data.rows;
  const q = (searchQuery || '').toLowerCase();
  if (q) rows = rows.filter(r => r.join(' ').toLowerCase().includes(q));

  const isStatusCol = (mod && mod.statusCols) ? (i => mod.statusCols.includes(i)) : (_ => false);

  let html = '<div class="table-wrap"><table><thead><tr>';
  data.headers.forEach((h, i) => {
    html += `<th contenteditable="true" data-ci="${i}">${esc(h)}</th>`;
  });
  html += '<th class="action-col"></th></tr></thead><tbody>';

  rows.forEach((row, ri) => {
    html += `<tr>`;
    data.headers.forEach((_, ci) => {
      const val = row[ci] || '';
      const cls = isStatusCol(ci) ? statusClass(val) : '';
      html += `<td contenteditable="true" class="${cls}" data-ri="${ri}" data-ci="${ci}">${esc(val)}</td>`;
    });
    html += `<td class="action-col"><button class="btn-del" data-ri="${ri}" title="Delete row">&times;</button></td></tr>`;
  });

  html += '</tbody></table></div>';
  container.innerHTML = html;

  container.querySelectorAll('td[contenteditable], th[contenteditable]').forEach(el => {
    el.addEventListener('blur', () => saveFromDOM(moduleId, container));
    el.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData||window.clipboardData).getData('text/plain')); });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.blur(); }
      if (e.key === 'Tab') {
        e.preventDefault();
        const cells = Array.from(container.querySelectorAll('td[contenteditable], th[contenteditable]'));
        const idx = cells.indexOf(el);
        const next = e.shiftKey ? cells[idx-1] : cells[idx+1];
        if (next) { next.focus(); const range = document.createRange(); range.selectNodeContents(next); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); }
      }
    });
  });

  container.querySelectorAll('.btn-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const ri = parseInt(btn.dataset.ri);
      const d = getData(moduleId);
      if (!d) return;
      d.rows.splice(ri, 1);
      setData(moduleId, d);
      renderEditableTable(containerId, moduleId, searchQuery);
      toast('Row deleted');
    });
  });
}

function saveFromDOM(moduleId, container) {
  const table = container.querySelector('table');
  if (!table) return;
  const headers = Array.from(table.querySelectorAll('thead th:not(.action-col)')).map(th => th.textContent.trim());
  const rows = Array.from(table.querySelectorAll('tbody tr')).map(tr =>
    Array.from(tr.querySelectorAll('td:not(.action-col)')).map(td => td.textContent.trim())
  );
  setData(moduleId, { headers, rows });

  const mod = getModule(moduleId);
  if (mod && mod.statusCols) {
    table.querySelectorAll('tbody td[data-ci]').forEach(td => {
      const ci = parseInt(td.dataset.ci);
      if (mod.statusCols.includes(ci)) {
        td.className = statusClass(td.textContent.trim());
      }
    });
  }
}

function addRow(moduleId, containerId, searchEl) {
  const data = getData(moduleId);
  if (!data || !data.headers.length) return;
  const newRow = data.headers.map(() => '');
  data.rows.push(newRow);
  setData(moduleId, data);
  const q = searchEl ? document.getElementById(searchEl)?.value : '';
  renderEditableTable(containerId, moduleId, q);
  const container = document.getElementById(containerId);
  const lastRow = container.querySelector('tbody tr:last-child td[contenteditable]');
  if (lastRow) { lastRow.scrollIntoView({behavior:'smooth'}); lastRow.focus(); }
  toast('Row added — click cells to edit');
}

function addColumn(moduleId, containerId, searchEl) {
  const name = prompt('Column name:');
  if (!name) return;
  const data = getData(moduleId);
  if (!data) return;
  data.headers.push(name.trim());
  data.rows.forEach(r => r.push(''));
  setData(moduleId, data);
  const q = searchEl ? document.getElementById(searchEl)?.value : '';
  renderEditableTable(containerId, moduleId, q);
  toast('Column "' + name.trim() + '" added');
}

async function doImport(moduleId) {
  if (moduleId === 'calendar') {
    await calendarImport();
    return;
  }
  if (getData(moduleId)) {
    if (!confirm('This will overwrite existing data for this module. Continue?')) return;
  }
  toast('Importing…');
  const result = await importModule(moduleId);
  if (result) {
    toast('Imported ' + result.rows.length + ' rows');
    const containerId = 'table-' + moduleId;
    renderEditableTable(containerId, moduleId);
    if (moduleId === 'compliance' || moduleId === 'programs' || moduleId === 'vendors' || moduleId === 'insurance' || moduleId === 'participants') {
      renderDashboard();
    }
  } else {
    toast('Import failed — source file not found or empty');
  }
}

function initEmpty(moduleId) {
  const mod = getModule(moduleId);
  if (!mod || !mod.defaultHeaders) return;
  setData(moduleId, { headers: [...mod.defaultHeaders], rows: [] });
  renderEditableTable('table-' + moduleId, moduleId);
  toast('Empty table created — add rows to get started');
}

function promptHeaders(moduleId) {
  const input = prompt('Enter column names separated by commas:');
  if (!input) return;
  const headers = input.split(',').map(s => s.trim()).filter(Boolean);
  if (!headers.length) return;
  setData(moduleId, { headers, rows: [] });
  renderEditableTable('table-' + moduleId, moduleId);
  toast('Table created with ' + headers.length + ' columns');
}

// EXPORT

function exportCSV(moduleId) {
  const data = getData(moduleId);
  if (!data) { toast('No data to export'); return; }
  const csv = [data.headers.join(','), ...data.rows.map(r => r.map(c => '"' + (c||'').replace(/"/g,'""') + '"').join(','))].join('\n');
  const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = moduleId + '-export.csv'; a.click();
  toast('Exported ' + moduleId + '.csv');
}

function exportAllCSV() {
  const store = getStore();
  let count = 0;
  for (const key of Object.keys(store)) {
    if (key.startsWith('_')) continue;
    const data = store[key];
    if (!data || !data.headers) continue;
    const csv = [data.headers.join(','), ...data.rows.map(r => r.map(c => '"' + (c||'').replace(/"/g,'""') + '"').join(','))].join('\n');
    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = key + '-export.csv'; a.click();
    count++;
  }
  toast('Exported ' + count + ' files');
}

  let html = `<div class="nav-header"><div class="logo-icon">J</div><div class="logo-text">JMC Platform<small>Internal Dashboards</small></div></div><div class="nav-links">`;

  let lastSection = '';
  MODULES.forEach(mod => {
    if (mod.section !== lastSection) {
      html += `<div class="nav-section-label">${mod.section}</div>`;

    }
    html += `<a class="nav-link${mod.id === 'dashboard' ? ' active' : ''}" data-page="${mod.id}">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">${mod.icon}</svg>

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  const page = document.getElementById('page-' + id);
  if (page) page.classList.add('active');
  document.querySelectorAll(`.nav-link[data-page="${id}"]`).forEach(l => l.classList.add('active'));
  document.getElementById('breadcrumb').textContent = (getModule(id) || {}).title || id;
  window.location.hash = id;

  if (id === 'calendar') {
    renderCalendarView();
  } else if (id !== 'dashboard' && id !== 'settings') {
    renderEditableTable('table-' + id, id);
  }
  if (id === 'dashboard') renderDashboard();
}

// DASHBOARD (auto-computed)
// ═══════════════════════════════════════════════════════════════════════════
function renderDashboard() {
  const programs = getData('programs');
  const compliance = getData('compliance');
  const vendors = getData('vendors');
  const insurance = getData('insurance');
  const participants = getData('participants');
  const trainings = getData('trainings');
  const escalations = getData('escalations');
  const costs = getData('finance') || getData('costs');

  const programCount = programs ? programs.rows.length : 0;
  const vendorCount = vendors ? vendors.rows.length : 0;
  const insuranceCount = insurance ? insurance.rows.length : 0;
  const participantCount = participants ? participants.rows.length : 0;
  const trainingCount = trainings ? trainings.rows.length : 0;

  let compRate = 0, compNeeded = 0;
  if (compliance && compliance.rows.length) {
    const mod = getModule('compliance');
    const sCols = mod.statusCols || [];
    let total = 0, complete = 0;
    compliance.rows.forEach(r => {
      sCols.forEach(ci => {
        const v = (r[ci]||'').toLowerCase();
        if (v && v !== 'n/a' && v !== 'na' && v !== '—') {
          total++;
          if (v.includes('complete') || v.includes('confirm') || v.includes('done') || v.includes('pass') || v.includes('verified') || v.includes('yes')) complete++;
          else compNeeded++;
        }
      });
    });
    compRate = total > 0 ? Math.round((complete / total) * 100) : 0;
  }

  const openEscalations = escalations ? escalations.rows.filter(r => {
    const status = (r[6]||'').toLowerCase();
    return status && !status.includes('resolved') && !status.includes('closed');
  }).length : 0;

  const kpis = document.getElementById('dash-kpis');
  kpis.innerHTML = `
    <div class="kpi-card"><span class="kpi-label">Programs</span><div class="kpi-value">${programCount}</div></div>
    <div class="kpi-card ${compRate >= 80 ? 'green' : compRate >= 50 ? 'yellow' : compRate > 0 ? 'red' : ''}"><span class="kpi-label">Compliance Rate</span><div class="kpi-value">${compRate > 0 ? compRate + '%' : '—'}</div></div>
    <div class="kpi-card ${compNeeded > 0 ? 'yellow' : ''}"><span class="kpi-label">Compliance Items Needed</span><div class="kpi-value">${compNeeded || '—'}</div></div>
    <div class="kpi-card ${openEscalations > 0 ? 'red' : ''}"><span class="kpi-label">Open Escalations</span><div class="kpi-value">${openEscalations || '0'}</div></div>
    <div class="kpi-card"><span class="kpi-label">Vendors</span><div class="kpi-value">${vendorCount || '—'}</div></div>
    <div class="kpi-card"><span class="kpi-label">Insurance Policies</span><div class="kpi-value">${insuranceCount || '—'}</div></div>
    <div class="kpi-card"><span class="kpi-label">Participants</span><div class="kpi-value">${participantCount || '—'}</div></div>
    <div class="kpi-card"><span class="kpi-label">Trainings</span><div class="kpi-value">${trainingCount || '—'}</div></div>
  `;

  const alerts = document.getElementById('dash-alerts');
  let alertHtml = '';
  if (!isInitialized() && programCount === 0) {
    alertHtml += '<div class="alert-bar info">📥 <strong>Getting Started:</strong> Go to <a href="#settings" onclick="showPage(\'settings\')">Settings</a> to import data from your source files, or navigate to any module and click "Import from Source File".</div>';
  }
  if (compNeeded > 0) {
    alertHtml += `<div class="alert-bar warn">⏰ <strong>Compliance:</strong> ${compNeeded} items across camps still marked as "Needed". <a href="#compliance" onclick="showPage('compliance')">View Compliance →</a></div>`;
  }
  if (openEscalations > 0) {
    alertHtml += `<div class="alert-bar err">⚠️ <strong>Escalations:</strong> ${openEscalations} open escalation(s). <a href="#escalations" onclick="showPage('escalations')">View Escalations →</a></div>`;
  }
  if (programCount > 0 && compNeeded === 0 && openEscalations === 0) {
    alertHtml += '<div class="alert-bar ok">✅ All clear — no urgent items.</div>';
  }
  alerts.innerHTML = alertHtml;

  const heatmap = document.getElementById('dash-heatmap');
  if (compliance && compliance.rows.length) {
    const mod = getModule('compliance');
    const sCols = mod.statusCols || [];
    const reqHeaders = sCols.map(ci => compliance.headers[ci] || `Col ${ci}`);
    const camps = compliance.rows;

    let hmHtml = `<div class="heatmap" style="grid-template-columns:100px repeat(${reqHeaders.length},1fr)">`;
    hmHtml += '<div class="hm-cell hm-hdr">Camp</div>';
    reqHeaders.forEach(h => { hmHtml += `<div class="hm-cell hm-hdr">${esc(h)}</div>`; });

    camps.forEach(row => {
      const campName = row[0] || '—';
      hmHtml += `<div class="hm-cell hm-hdr" style="text-align:left;font-size:10px">${esc(campName)}</div>`;
      sCols.forEach(ci => {
        const v = (row[ci]||'').toLowerCase();
        let cls = 'hm-gray';
        if (v.includes('complete') || v.includes('confirm') || v.includes('done') || v.includes('pass') || v.includes('verified') || v.includes('yes')) cls = 'hm-green';
        else if (v.includes('needed') || v.includes('expir')) cls = 'hm-yellow';
        else if (v.includes('pending') || v.includes('missing') || v.includes('overdue')) cls = 'hm-red';
        hmHtml += `<div class="hm-cell ${cls}">${esc(row[ci]||'—')}</div>`;
      });
    });
    hmHtml += '</div>';
    heatmap.innerHTML = hmHtml;
  } else {
    heatmap.innerHTML = '<div class="empty-state"><p>Import Compliance data to see the heatmap.</p><button class="btn btn-sm btn-primary" onclick="doImport(\'compliance\');renderDashboard()">Import Compliance</button></div>';
  }

  const summary = document.getElementById('dash-summary');
  const allMods = MODULES.filter(m => m.id !== 'dashboard' && m.id !== 'settings');
  let sumHtml = '<div class="table-wrap"><table><thead><tr><th>Module</th><th>Rows</th><th>Status</th></tr></thead><tbody>';
  allMods.forEach(mod => {
    const d = getData(mod.id);
    const count = d ? d.rows.length : 0;
    const status = count > 0 ? '<span style="color:var(--success);font-weight:600">● Active</span>' : '<span style="color:var(--muted)">○ Empty</span>';
    sumHtml += `<tr style="cursor:pointer" onclick="showPage('${mod.id}')"><td><strong>${esc(mod.title)}</strong></td><td>${count}</td><td>${status}</td></tr>`;
  });
  sumHtml += '</tbody></table></div>';
  summary.innerHTML = sumHtml;
}

let calendarEvents = [];
let calCurrentView = 'timeline';
let calCurrentMonth = new Date().getMonth();
let calCurrentYear = new Date().getFullYear();
let calFilteredPrograms = new Set();

async function parseCalendarSource() {
  const stored = localStorage.getItem('jmc_calendar_events');
  if (stored) {
    try {
      calendarEvents = JSON.parse(stored);
      calFilteredPrograms = new Set(calendarEvents.map(e => e.program));
      return;
    } catch(e) { /* fall through */ }
  }

  try {
    const res = await fetch('Annual Calendar.html');
    if (!res.ok) return;
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const table = doc.querySelector('table.waffle');
    if (!table) return;
    const allRows = Array.from(table.querySelectorAll('tbody tr'));
    if (allRows.length < 23) return;

    const events = [];

    for (let i = 23; i < allRows.length; i++) {
      const cells = Array.from(allRows[i].querySelectorAll('td'));
      const program = cleanText(cells[0]?.textContent || '');
      const event = cleanText(cells[1]?.textContent || '');
      if (!program || !event) continue;

      let startTxt = '', endTxt = '';
      for (let j = 3; j < cells.length; j++) {
        const txt = cleanText(cells[j]?.textContent || '');
        if (txt && /\d+\/\d+\/\d+/.test(txt)) {
          if (!startTxt) startTxt = txt;
          else { endTxt = txt; break; }
        }
      }
      if (!startTxt) continue;
      if (!endTxt) endTxt = startTxt;

      const start = parseDateStr(startTxt);
      const end = parseDateStr(endTxt);
      if (!start || !end) continue;

      const isStaff = program.toLowerCase().includes('staff');
      const baseProgram = program.replace(/\s*Staff\s*/i, '').trim();
      const type = isStaff ? 'Staff' : (program === 'Other' ? 'Other' : 'Camp');

      events.push({
        id: 'evt-' + i,
        program: program,
        baseProgram: baseProgram,
        event: event,
        type: type,
        start: start.toISOString().split('T')[0],
        end: end.toISOString().split('T')[0],
        location: '',
      });
    }

    calendarEvents = events;
    calFilteredPrograms = new Set(events.map(e => e.program));
    localStorage.setItem('jmc_calendar_events', JSON.stringify(events));
  } catch(e) {
    console.error('Failed to parse calendar:', e);
  }
}

function parseDateStr(s) {
  if (!s) return null;
  const parts = s.split('/');
  if (parts.length === 3) {
    let [m, d, y] = parts.map(Number);
    if (y < 100) y += 2000;
    return new Date(y, m - 1, d);
  }
  if (parts.length === 2) {
    const [m, d] = parts.map(Number);
    return new Date(2026, m - 1, d);
  }
  return null;
}

function daysBetween(a, b) {
  return Math.round((b - a) / 86400000) + 1;
}

function dayOffset(from, to) {
  return Math.round((to - from) / 86400000);
}

function formatDate(d) {
  const dt = typeof d === 'string' ? new Date(d) : d;
  return `${MONTH_SHORT[dt.getMonth()]} ${dt.getDate()}`;
}

function formatDateFull(d) {
  const dt = typeof d === 'string' ? new Date(d) : d;
  return `${MONTH_NAMES[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
}

function formatDateInput(d) {
  const dt = typeof d === 'string' ? new Date(d) : d;
  return dt.toISOString().split('T')[0];
}

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Month
        </button>
      </div>
      <div class="cal-filter-wrap">
        <button class="cal-filter-btn" onclick="this.nextElementSibling.classList.toggle('open')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="14" height="14"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
          Filter
        </button>
        <div class="cal-filter-dd" id="calFilterDropdown"></div>
      </div>
      <button class="cal-today-btn" onclick="calGoToday()">Today</button>
      <div class="cal-nav" id="calNavControls" style="display:none">
        <button class="cal-nav-btn" onclick="calNavPrev()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button class="cal-nav-btn" onclick="calNavNext()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
        <button class="btn btn-primary btn-sm" onclick="openEventModal()">+ Add Event</button>
        <button class="btn btn-sm" onclick="doImport('calendar')">↻ Re-import</button>
      </div>
    </div>
    <div class="cal-legend" id="calLegend"></div>
    <div id="calendarContent"></div>
    <div class="source-link" style="margin-top:8px">Source: <a href="Annual Calendar.html" target="_blank">Annual Calendar.html</a></div>
  </section>`;
}

function switchCalView(view) {
  calCurrentView = view;
  document.querySelectorAll('.cal-view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('calNavControls').style.display = view === 'month' ? 'flex' : 'none';
  renderCalendarView();
}

function calGoToday() {
  calCurrentMonth = new Date().getMonth();
  calCurrentYear = new Date().getFullYear();
  renderCalendarView();
  setTimeout(() => {
    const todayLine = document.querySelector('.gantt-today-line');
    if (todayLine) {
      const wrap = todayLine.closest('.gantt-wrap');
      if (wrap) wrap.scrollLeft = Math.max(0, parseInt(todayLine.style.left) - 260 - 200);
    }
  }, 100);
}

function calNavPrev() {
  calCurrentMonth--;
  if (calCurrentMonth < 0) { calCurrentMonth = 11; calCurrentYear--; }
  renderCalendarView();
}

function calNavNext() {
  calCurrentMonth++;
  if (calCurrentMonth > 11) { calCurrentMonth = 0; calCurrentYear++; }
  renderCalendarView();
}

function buildCalendarLegend() {
  const legendEl = document.getElementById('calLegend');
  if (!legendEl) return;
  const programs = [...new Set(calendarEvents.map(e => e.program))].sort();
  legendEl.innerHTML = programs.map(p => {
    const c = getProgColor(p);
    const dimmed = !calFilteredPrograms.has(p) ? ' dimmed' : '';
    return `<span class="cal-legend-item${dimmed}" onclick="toggleCalProgram('${p}')" title="Click to toggle"><span class="cal-legend-dot" style="background:${c.bg}"></span>${p}</span>`;
  }).join('');
}

function buildCalendarFilterDropdown() {
  const dd = document.getElementById('calFilterDropdown');
  if (!dd) return;
  const programs = [...new Set(calendarEvents.map(e => e.program))].sort();
  dd.innerHTML = `<label style="margin-bottom:6px;font-weight:600;font-size:10px;color:var(--accent);cursor:pointer" onclick="calToggleAll()">Toggle All</label>` +
    programs.map(p => {
      const c = getProgColor(p);
      const checked = calFilteredPrograms.has(p) ? 'checked' : '';
      return `<label><input type="checkbox" ${checked} onchange="calToggleFilter('${p}',this.checked)"><span class="cal-filter-pill" style="background:${c.bg}"></span>${p}</label>`;
    }).join('');
}

function calToggleFilter(prog, on) {
  if (on) calFilteredPrograms.add(prog); else calFilteredPrograms.delete(prog);
  buildCalendarLegend();
  renderCalendarContent();
}

function toggleCalProgram(prog) {
  if (calFilteredPrograms.has(prog)) calFilteredPrograms.delete(prog); else calFilteredPrograms.add(prog);
  buildCalendarLegend();
  buildCalendarFilterDropdown();
  renderCalendarContent();
}

function calToggleAll() {
  const allPrograms = [...new Set(calendarEvents.map(e => e.program))];
  if (calFilteredPrograms.size === allPrograms.length) calFilteredPrograms.clear();
  else allPrograms.forEach(p => calFilteredPrograms.add(p));
  buildCalendarLegend();
  buildCalendarFilterDropdown();
  renderCalendarContent();
}

async function renderCalendarView() {
  if (!calendarEvents.length) await parseCalendarSource();
  buildCalendarLegend();
  buildCalendarFilterDropdown();
  updateCalMonthLabel();
  renderCalendarContent();
}

function updateCalMonthLabel() {
  const label = document.getElementById('calMonthLabel');
  if (!label) return;
  label.textContent = `${MONTH_NAMES[calCurrentMonth]} ${calCurrentYear}`;
}

function getFilteredEvents() {
  return calendarEvents.filter(e => calFilteredPrograms.has(e.program));
}

function renderCalendarContent() {
  const container = document.getElementById('calendarContent');
  if (!container) return;
  const events = getFilteredEvents();

  if (!events.length) {
    container.innerHTML = '<div class="empty-state"><p>No calendar events loaded. Import from source file or add events manually.</p><button class="btn btn-primary" onclick="doImport(\'calendar\')">Import Calendar</button></div>';
    return;
  }

  if (calCurrentView === 'timeline') renderTimelineView(container, events);
  else if (calCurrentView === 'list') renderListView(container, events);
  else if (calCurrentView === 'month') renderMonthView(container, events);
}

// ── GANTT (HORIZONTAL TIMELINE) VIEW ──
function renderTimelineView(container, events) {
  const sorted = [...events].sort((a, b) => new Date(a.start) - new Date(b.start));
  if (!sorted.length) { container.innerHTML = '<div class="empty-state"><p>No events to display.</p></div>'; return; }

  const today = new Date(); today.setHours(0,0,0,0);

  // Calculate range
  let earliest = new Date(sorted[0].start);
  let latest = new Date(sorted[0].end);
  sorted.forEach(e => {
    const s = new Date(e.start);
    const en = new Date(e.end);
    if (s < earliest) earliest = s;
    if (en > latest) latest = en;
  });

  const rangeStart = new Date(earliest.getFullYear(), earliest.getMonth(), 1);
  const rangeEnd = new Date(latest.getFullYear(), latest.getMonth() + 1, 0);

  const dayW = 5;
  const rowH = 40;
  const barH = 26;
  const barTop = Math.floor((rowH - barH) / 2);
  const sideW = 260;
  const headerH = 44;

  // Generate month columns
  const months = [];
  let cursor = new Date(rangeStart);
  while (cursor <= rangeEnd) {
    const mStart = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const mEnd = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
    const daysInMonth = mEnd.getDate();
    const offset = dayOffset(rangeStart, mStart);
    const yr = cursor.getFullYear();
    const label = MONTH_SHORT[cursor.getMonth()] + (yr !== new Date().getFullYear() ? ' ' + yr : '');
    months.push({ label, offset: offset * dayW, width: daysInMonth * dayW });
    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
  }

  const totalDays = dayOffset(rangeStart, rangeEnd) + 1;
  const timelineW = totalDays * dayW;
  const totalW = sideW + timelineW;

  let html = `<div class="gantt-wrap"><div class="gantt-inner" style="min-width:${totalW}px">`;

  // Header
  html += `<div class="gantt-header" style="height:${headerH}px">`;
  html += `<div class="gantt-label-hdr" style="width:${sideW}px;min-width:${sideW}px">Event</div>`;
  html += `<div style="display:flex;flex:1">`;
  months.forEach(m => {
    html += `<div class="gantt-month-col" style="width:${m.width}px">${m.label}</div>`;
  });
  html += `</div></div>`;

  // Body
  html += `<div class="gantt-body" style="position:relative">`;

  sorted.forEach((evt, i) => {
    const c = getProgColor(evt.program);
    const eStart = new Date(evt.start);
    const eEnd = new Date(evt.end);
    const startOff = dayOffset(rangeStart, eStart);
    const duration = dayOffset(eStart, eEnd) + 1;
    const barLeft = startOff * dayW;
    const barWidth = Math.max(duration * dayW, 22);
    const bgColor = i % 2 === 0 ? 'var(--card)' : '#f8fafc';

    html += `<div class="gantt-row" style="height:${rowH}px;background:${bgColor}">`;
    html += `<div class="gantt-label" style="width:${sideW}px;min-width:${sideW}px;height:${rowH}px;background:${bgColor}">`;
    html += `<span class="prog-badge" style="background:${c.soft};color:${c.bg}">${esc(evt.program)}</span>`;
    html += `<span class="evt-name" title="${esc(evt.event)}">${esc(evt.event)}</span>`;
    html += `</div>`;
    html += `<div style="flex:1;position:relative;height:${rowH}px">`;
    html += `<div class="gantt-bar" onclick="showEventPopup(calendarEvents.find(e=>e.id==='${evt.id}'),event)" style="top:${barTop}px;height:${barH}px;left:${barLeft}px;width:${barWidth}px;background:${c.bg};color:${c.text};z-index:2">`;
    if (barWidth > 55) {
      html += `<span style="overflow:hidden;text-overflow:ellipsis">${esc(evt.event)}</span>`;
    }
    html += `</div></div></div>`;
  });

  // Month grid lines
  months.forEach((m, i) => {
    if (i > 0) {
      html += `<div class="gantt-grid-line" style="left:${sideW + m.offset}px"></div>`;
    }
  });

  // Today line
  const todayOff = dayOffset(rangeStart, today);
  if (todayOff >= 0 && todayOff <= totalDays) {
    html += `<div class="gantt-today-line" style="left:${sideW + todayOff * dayW}px"><div class="gantt-today-label">Today</div></div>`;
  }

  html += `</div></div></div>`;
  container.innerHTML = html;

  // Auto-scroll to today
  const ganttWrap = container.querySelector('.gantt-wrap');
  if (ganttWrap && todayOff >= 0 && todayOff <= totalDays) {
    ganttWrap.scrollLeft = Math.max(0, todayOff * dayW - 200);
  }
}

// ── LIST VIEW ──
function renderListView(container, events) {
  const sorted = [...events].sort((a, b) => new Date(a.start) - new Date(b.start));
  const byMonth = {};
  sorted.forEach(e => {
    const d = new Date(e.start);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(e);
  });

  let html = '<div class="cal-list">';
  Object.keys(byMonth).sort().forEach(key => {
    const [y, m] = key.split('-').map(Number);
    const monthEvents = byMonth[key];
    html += `<div class="cal-list-month">
      <div class="cal-list-month-header">${MONTH_NAMES[m-1]} ${y}<span class="month-count">${monthEvents.length} event${monthEvents.length !== 1 ? 's' : ''}</span></div>
      <div class="cal-list-events">`;

    monthEvents.forEach(evt => {
      const c = getProgColor(evt.program);
      const start = new Date(evt.start);
      const end = new Date(evt.end);
      const days = daysBetween(start, end);
      html += `<div class="cal-evt-card" onclick="showEventPopup(calendarEvents.find(e=>e.id==='${evt.id}'),event)" style="--evt-color:${c.bg}">
        <div class="evt-color-bar" style="background:${c.bg}"></div>
        <div class="evt-body">
          <div class="evt-program" style="color:${c.bg}">${esc(evt.program)}</div>
          <div class="evt-title">${esc(evt.event)}</div>
          <div class="evt-dates">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            ${formatDate(evt.start)} – ${formatDate(evt.end)}
            <span class="evt-duration">${days} day${days !== 1 ? 's' : ''}</span>
          </div>
        </div>
        <div class="evt-type">${esc(evt.type)}</div>
      </div>`;
    });
    html += '</div></div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

// ── MONTH VIEW ──
function renderMonthView(container, events) {
  updateCalMonthLabel();
  const year = calCurrentYear;
  const month = calCurrentMonth;
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startPad = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const today = new Date(); today.setHours(0,0,0,0);

  const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthStart = new Date(year, month, 1);
  const monthEnd = new Date(year, month + 1, 0);
  const monthEvents = events.filter(e => {
    const s = new Date(e.start);
    const en = new Date(e.end);
    return s <= monthEnd && en >= monthStart;
  });

  let html = '<div class="cal-month-grid">';
  html += '<div class="cal-month-weekdays">';
  weekdays.forEach(w => html += `<div class="cal-month-weekday">${w}</div>`);
  html += '</div><div class="cal-month-days">';

  const prevMonth = new Date(year, month, 0);
  for (let i = startPad - 1; i >= 0; i--) {
    const dayNum = prevMonth.getDate() - i;
    html += `<div class="cal-month-day outside"><span class="day-num">${dayNum}</span></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const isToday = date.getTime() === today.getTime();
    const cls = isToday ? ' today' : '';

    const dayEvts = monthEvents.filter(e => {
      const s = new Date(e.start);
      const en = new Date(e.end);
      return date >= s && date <= en;
    });

    html += `<div class="cal-month-day${cls}">`;
    html += `<span class="day-num">${d}</span>`;
    html += `<div class="day-events">`;
    const maxShow = 3;
    dayEvts.slice(0, maxShow).forEach(evt => {
      const c = getProgColor(evt.program);
      html += `<div class="day-evt" style="background:${c.bg};color:${c.text}" onclick="event.stopPropagation();showEventPopup(calendarEvents.find(e=>e.id==='${evt.id}'),event)" title="${evt.program}: ${evt.event}">${esc(evt.event)}</div>`;
    });
    if (dayEvts.length > maxShow) {
      html += `<div class="day-more">+${dayEvts.length - maxShow} more</div>`;
    }
    html += '</div></div>';
  }

  const totalCells = startPad + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-month-day outside"><span class="day-num">${i}</span></div>`;
  }

  html += '</div></div>';
  container.innerHTML = html;
}

// ── EVENT POPUP ──
function showEventPopup(evt, mouseEvent) {
  document.querySelectorAll('.cal-evt-popup').forEach(p => p.remove());
  if (!evt) return;

  const c = getProgColor(evt.program);
  const start = new Date(evt.start);
  const end = new Date(evt.end);
  const days = daysBetween(start, end);

  const popup = document.createElement('div');
  popup.className = 'cal-evt-popup';
  popup.innerHTML = `
    <button class="popup-close" onclick="this.parentElement.remove()">&times;</button>
    <div class="popup-color" style="background:${c.bg}"></div>
    <div class="popup-title">${esc(evt.event)}</div>
    <div class="popup-program" style="color:${c.bg}">${esc(evt.program)}</div>
    <div class="popup-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      ${formatDateFull(evt.start)} – ${formatDateFull(evt.end)}
    </div>
    <div class="popup-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      ${days} day${days !== 1 ? 's' : ''}
    </div>
    <div class="popup-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
      ${esc(evt.type)}
    </div>
    ${evt.location ? `<div class="popup-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      ${esc(evt.location)}
    </div>` : ''}
    <div class="popup-actions">
      <button class="btn btn-sm" onclick="document.querySelectorAll('.cal-evt-popup').forEach(p=>p.remove());openEventModal(calendarEvents.find(e=>e.id==='${evt.id}'))">✏️ Edit</button>
      <button class="btn btn-danger btn-sm" onclick="deleteCalendarEvent('${evt.id}')">🗑️ Delete</button>
    </div>
  `;

  document.body.appendChild(popup);

  const rect = popup.getBoundingClientRect();
  let x = mouseEvent.clientX + 12;
  let y = mouseEvent.clientY - 10;
  if (x + rect.width > window.innerWidth - 20) x = mouseEvent.clientX - rect.width - 12;
  if (y + rect.height > window.innerHeight - 20) y = window.innerHeight - rect.height - 20;
  if (y < 10) y = 10;
  popup.style.left = x + 'px';
  popup.style.top = y + 'px';

  setTimeout(() => {
    document.addEventListener('click', function handler(e) {
      if (!popup.contains(e.target)) { popup.remove(); document.removeEventListener('click', handler); }
    });
  }, 100);
}

// ── EVENT CRUD ──
function openEventModal(evt) {
  const isEdit = !!evt;
  const title = isEdit ? 'Edit Event' : 'Add New Event';
  const programs = [...new Set(calendarEvents.map(e => e.program))].sort();

  let body = '<form id="eventForm" onsubmit="event.preventDefault();saveCalendarEvent()">';
  body += '<label>Event Name *</label>';
  body += `<input type="text" id="evtName" value="${isEdit ? esc(evt.event) : ''}" placeholder="e.g. Summer Camp Session 1" required />`;
  body += '<label>Program / Camp *</label>';
  body += '<select id="evtProgram" onchange="document.getElementById(\'evtCustomProgWrap\').style.display=this.value===\'__custom\'?\'block\':\'none\'">';
  if (!isEdit) body += '<option value="">— Select —</option>';
  programs.forEach(p => {
    body += `<option value="${esc(p)}" ${isEdit && evt.program === p ? 'selected' : ''}>${esc(p)}</option>`;
  });
  body += '<option value="__custom">+ Add new program…</option></select>';
  body += '<div id="evtCustomProgWrap" style="display:none"><label>New Program Name</label><input type="text" id="evtCustomProg" placeholder="Enter program name" /></div>';
  body += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
  body += '<div><label>Start Date *</label>';
  body += `<input type="date" id="evtStart" value="${isEdit ? evt.start : ''}" required /></div>`;
  body += '<div><label>End Date *</label>';
  body += `<input type="date" id="evtEnd" value="${isEdit ? evt.end : ''}" required /></div>`;
  body += '</div>';
  body += '<label>Type</label>';
  body += '<select id="evtType">';
  ['Camp','Staff','Meeting','Training','Other'].forEach(t => {
    body += `<option value="${t}" ${isEdit && evt.type === t ? 'selected' : ''}>${t}</option>`;
  });
  body += '</select>';
  body += '<label>Location</label>';
  body += `<input type="text" id="evtLocation" value="${isEdit && evt.location ? esc(evt.location) : ''}" placeholder="Optional — e.g. Chicago, IL" />`;
  body += `<input type="hidden" id="evtEditId" value="${isEdit ? evt.id : ''}" />`;
  body += '<div class="modal-actions">';
  if (isEdit) {
    body += `<button type="button" class="btn btn-danger btn-sm" onclick="deleteCalendarEvent('${evt.id}')">Delete Event</button>`;
    body += '<div style="flex:1"></div>';
  }
  body += '<button type="button" class="btn" onclick="closeModal()">Cancel</button>';
  body += `<button type="submit" class="btn btn-primary">${isEdit ? 'Save Changes' : 'Add Event'}</button>`;
  body += '</div></form>';

  openModal(title, body);
}

function saveCalendarEvent() {
  const editId = document.getElementById('evtEditId').value;
  const name = document.getElementById('evtName').value.trim();
  const progSel = document.getElementById('evtProgram').value;
  const program = progSel === '__custom' ? (document.getElementById('evtCustomProg').value.trim()) : progSel;
  const start = document.getElementById('evtStart').value;
  const end = document.getElementById('evtEnd').value;
  const type = document.getElementById('evtType').value;
  const location = document.getElementById('evtLocation').value.trim();

  if (!name || !program || !start || !end) {
    toast('Please fill in all required fields');
        return;
      }
  if (new Date(end) < new Date(start)) {
    toast('End date must be on or after start date');
    return;
  }

  if (editId) {
    const idx = calendarEvents.findIndex(e => e.id === editId);
    if (idx >= 0) {
      calendarEvents[idx].event = name;
      calendarEvents[idx].program = program;
      calendarEvents[idx].baseProgram = program.replace(/\s*Staff\s*/i, '').trim();
      calendarEvents[idx].start = start;
      calendarEvents[idx].end = end;
      calendarEvents[idx].type = type;
      calendarEvents[idx].location = location;
      toast('Event updated');
    }
  } else {
    const newEvt = {
      id: 'evt-' + Date.now(),
      program,
      baseProgram: program.replace(/\s*Staff\s*/i, '').trim(),
      event: name,
      type,
      start,
      end,
      location,
    };
    calendarEvents.push(newEvt);
    calFilteredPrograms.add(program);
    toast('Event added');
  }

  localStorage.setItem('jmc_calendar_events', JSON.stringify(calendarEvents));
  closeModal();
  renderCalendarView();
}

function deleteCalendarEvent(id) {
  if (!confirm('Delete this event permanently?')) return;
  calendarEvents = calendarEvents.filter(e => e.id !== id);
  localStorage.setItem('jmc_calendar_events', JSON.stringify(calendarEvents));
  closeModal();
  document.querySelectorAll('.cal-evt-popup').forEach(p => p.remove());
  renderCalendarView();
  toast('Event deleted');
}

// Override calendar import
async function calendarImport() {
  localStorage.removeItem('jmc_calendar_events');
  calendarEvents = [];
  await parseCalendarSource();
  toast('Calendar events imported: ' + calendarEvents.length + ' events');
  renderCalendarView();
}

// ═══════════════════════════════════════════════════════════════════════════
// SETTINGS PAGE
// ═══════════════════════════════════════════════════════════════════════════
function renderSettings() {
  const tbody = document.getElementById('settingsDataTable');
  if (!tbody) return;
  const store = getStore();
  let html = '';
  MODULES.filter(m => m.id !== 'dashboard' && m.id !== 'settings').forEach(mod => {
    const d = getData(mod.id);
    const count = d ? d.rows.length : 0;
    const src = mod.source ? (Array.isArray(mod.source) ? mod.source.join(', ') : mod.source) : '—';
    html += `<tr>
      <td><strong>${esc(mod.title)}</strong></td>
      <td>${count}</td>
      <td style="font-size:11px;color:var(--muted)">${src}</td>
      <td style="font-size:11px;color:var(--muted)">${store._lastModified ? new Date(store._lastModified).toLocaleDateString() : '—'}</td>
      <td>
        ${mod.source ? `<button class="btn btn-sm" onclick="doImport('${mod.id}');renderSettings()">Import</button>` : ''}
        <button class="btn btn-sm" onclick="exportCSV('${mod.id}')">Export</button>
        <button class="btn btn-sm btn-danger" onclick="if(confirm('Clear ${mod.title} data?')){clearData('${mod.id}');renderSettings();toast('Cleared')}">Clear</button>
      </td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

async function bulkImport() {
  const statusEl = document.getElementById('importStatus');
  statusEl.textContent = 'Importing…';
  const sourceMods = MODULES.filter(m => m.source);
  let imported = 0, failed = 0;
  for (const mod of sourceMods) {
    statusEl.textContent = `Importing ${mod.title}…`;
    const result = await importModule(mod.id);
    if (result) imported++; else failed++;
  }
  markInitialized();
  statusEl.innerHTML = `<strong>Done!</strong> Imported ${imported} modules. ${failed > 0 ? failed + ' source files not found.' : ''}`;
  renderSettings();
  renderDashboard();
  toast('Bulk import complete');
}

// ═══════════════════════════════════════════════════════════════════════════
// INITIALIZATION
// ═══════════════════════════════════════════════════════════════════════════
buildNav();
buildPages();
renderDashboard();

if (!isInitialized()) {
  autoImportAll().then(count => {
    if (count > 0) {
      markInitialized();
      renderDashboard();
      toast('Auto-imported ' + count + ' modules from source files');
    }
  });
}

if (window.location.hash) {
  const page = window.location.hash.slice(1);
  if (getModule(page)) showPage(page);
}

const observer = new MutationObserver(() => {
  if (document.getElementById('page-settings')?.classList.contains('active')) renderSettings();
});
observer.observe(document.getElementById('appContent'), { attributes: true, subtree: true, attributeFilter: ['class'] });

document.addEventListener('click', (e) => {
  const dd = document.getElementById('calFilterDropdown');
  if (dd && dd.classList.contains('open') && !e.target.closest('.cal-filter-wrap')) {
    dd.classList.remove('open');
  }
    });
  </script>
</body>
